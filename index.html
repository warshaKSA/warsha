function tr1(t){const n=[],k=t.replace(/\d+(\.\d+)?/g,m=>{n.push(m);return '#'}),r=DICT[k];if(r===undefined)return null;let i=0;return r.replace(/#/g,()=>n[i++]??'#')}
function tr(s){s=String(s);const t=s.trim();if(!t||!/[\u0600-\u06FF]/.test(t))return s;const d=tr1(t);if(d!==null)return s.replace(t,()=>d);for(const [re,f] of RULES){const m=t.match(re);if(m)return s.replace(t,()=>f(m))}for(const sep of [' · ','، ',': ']){if(t.includes(sep)){const o=sep==='، '?', ':sep,p=t.split(sep).map(x=>tr(x)).join(o);if(p!==t.split(sep).join(o))return s.replace(t,()=>p)}}return s.replace(t,()=>t.replace(/(\d+) ص(?=\s|$)/g,'$1 AM').replace(/(\d+) م(?=\s|$)/g,'$1 PM').replace(/ إلى /g,' to ').replace(/(\d) ر\.س/g,'$1 SAR').replace(/(\d) كم/g,'$1 km'))}

  <h2>رقم الواتساب</h2><input class=inp inputmode=tel dir=ltr value="${esc(w.wa)}" onchange="W(S.me).wa=this.value.replace(/\\D/g,'');save();toast('تم حفظ الرقم')">${revSec(w)}${hist(w)}</div>`;
}
function setP(i,v){W(S.me).s[i].p=Math.max(0,+v||0);save();toast('تم حفظ السعر');render()}
function delS(i){W(S.me).s.splice(i,1);save();render()}
function addS(){const n=$('#ns').value.trim(),p=+$('#np').value;if(!n||!p){toast('اكتب اسم الخدمة وسعرها');return}W(S.me).s.push({n,p});save();render();toast('تمت إضافة الخدمة')}
function togC(c){const w=W(S.me),i=w.cats.indexOf(c);i<0?w.cats.push(c):w.cats.splice(i,1);save();render()}
function lgSec(w){return `<h2>شعار أو صورة الورشة</h2><p class=mute style="margin:0 0 8px">تظهر جنب اسم ورشتك للعملاء</p><div class=row>${avt(w)}<div style="flex:1"><button class="btn ghost" onclick="sheet(1)">${w.lg?'غيّر الصورة':'إضافة صورة'}</button>${w.lg?`<button class=x style="font-size:14px;margin-top:4px" onclick="W(S.me).lg='';save();render()">حذف الصورة</button>`:''}</div></div>`}
function setLg(inp){const w=W(S.me),f=inp.files[0];sheet(0);if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);upLogo(c,w)};im.src=r.result};r.readAsDataURL(f);inp.value=''}
function sheet(o){$('#sheet').hidden=!o}
function setMap(u){u=u.trim();if(!isMap(u)){toast('حط رابط صحيح من خرائط جوجل');render();return}W(S.me).map=u;setLL(W(S.me),u);save();toast('تم حفظ رابط الموقع')}
function hist(w){roll(w);const Y=new Date().getFullYear(),k0=mk(new Date());if(!w.m[k0])w.m[k0]=[0,0];const ks=Object.keys(w.m).sort().reverse(),ys=Object.keys(w.y||{}).sort().reverse();
return `<h2>الإحصائيات الشهرية ${Y}</h2><div class=card style="cursor:default;padding:4px 14px"><div class="st mute"><b>الشهر</b><b>الزيارات</b><b>واتساب</b></div>${ks.map(k=>`<div class=st><span>${MN[+k.slice(5)-1]}${k===k0?' (الحالي)':''}</span><span>${w.m[k][0]}</span><span>${w.m[k][1]}</span></div>`).join('')}</div>`+(ys.length?`<h2>السنوات اللي راحت</h2>`+ys.map(y=>{const a=w.y[y],n=a.n||1;return `<div class=card style="cursor:default"><b>${y}</b><div>متوسط الشهر: ${Math.round(a.v/n)} زيارة · ${Math.round(a.c/n)} ضغطة واتساب</div><div class=mute>الإجمالي: ${a.v} زيارة · ${a.c} ضغطة</div></div>`}).join(''):'')}
function renU(){const u=me(),n=v('nn');if(n===u.n)return;if(n.length<3){toast('الاسم 3 حروف على الأقل');return}if(S.users.some(x=>x.n===n)){toast('هذا الاسم مستخدم');return}S.ws.forEach(w=>(w.rv||[]).forEach(r=>{if(r.u===u.n)r.u=n}));u.n=n;S.user=n;if(sb)sb.from('profiles').update({display_name:n}).then(()=>{});save();render();toast('تم تغيير اسم الحساب')}
function prof(u){
  const fv=S.ws.filter(w=>!w.off&&on(w)&&(u.fav||[]).includes(w.id)),rv=S.ws.flatMap(w=>(w.rv||[]).filter(x=>x.u===u.n).map(x=>({w,x}))),mt=[...(u.mt||[])].sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class=pad><div class=row style="justify-content:space-between"><h2 style="margin:0">أهلاً ${esc(u.n)}</h2><button class=x style="color:var(--mute);font-size:14px" onclick="doOut()">خروج</button></div>
  <div class=card style="cursor:default"><label class=mute for=nn>اسم الحساب (يظهر مع تقييماتك)</label><div class=row style="margin-top:4px"><input id=nn class=inp value="${esc(u.n)}" maxlength=30><button class=btn style="width:auto;padding:10px 18px" onclick="renU()">حفظ</button></div></div>
  <h2>ورشاتي المفضلة</h2>${fv.length?fv.map(w=>`<div class=card onclick="openW(${w.id})" role=button tabindex=0 onkeydown="if(event.key==='Enter')openW(${w.id})"><div class=row>${avt(w,1)}<div style="flex:1"><h3>${esc(w.name)}</h3><div class=mute>${esc(loc(w))}</div></div><span class=star>★</span><b>${avg(w).toFixed(1)}</b></div></div>`).join(''):'<p class=mute>ما أضفت ورش للمفضلة. اضغط ♡ في صفحة أي ورشة.</p>'}
  <h2>تقييماتي</h2>${rv.length?rv.map(({w,x})=>`<div class=card style="cursor:default"><div class=row style="justify-content:space-between"><b>${esc(w.name)}</b><span class=mute>${esc(x.d)}</span></div><span class=star>${stars(x.r)}</span><p style="margin:4px 0 8px">${esc(x.t)}</p>${x.rp?`<div class=rp><div class=row style="justify-content:space-between"><b>رد صاحب الورشة:</b><span class=mute>${esc(x.rp.d||'')}</span></div>${esc(x.rp.t)}</div>`:''}<button class="btn ghost" style="padding:6px" onclick="editR(${w.id})">تعديل التقييم</button></div>`).join(''):'<p class=mute>ما كتبت أي تقييم بعد.</p>'}
  <h2>سجل صيانة سيارتي</h2><div class=card style="cursor:default"><input id=m1 class=inp placeholder="وش الصيانة؟ مثال: تغيير فحمات" maxlength=80><label class=mute for=m2 style="display:block;margin-top:8px">التاريخ</label><input id=m2 type=date class=inp dir=ltr><button class=btn style="margin-top:8px" onclick="addM()">أضف للسجل</button></div>
  ${mt.length?`<div class=card style="cursor:default;padding:4px 14px">${mt.map(m=>`<div class=srv><span>${esc(m.t)}<br><span class=mute>${fmtD(m.d)}</span></span><button class=x aria-label="حذف" onclick="delM('${m.id}')">✕</button></div>`).join('')}</div>`:'<p class=mute>ما فيه صيانة مسجلة.</p>'}</div>`}
function editR(id){const x=(W(id).rv||[]).find(r=>r.u===S.user);S.mode='c';S.cur=id;S.dt='r';S.rs=x?x.r:0;S.rt=x?x.t:'';go()}
function addM(){const u=me(),t=v('m1'),d=$('#m2').value;if(t.length<2||!d){toast('اكتب الصيانة وحدد التاريخ');return}guard(async()=>{const uid=await uidNow();if(!uid){toast('سجل دخول أول');return}const{data,error}=await sb.from('maintenance_logs').insert({user_id:uid,description:t,done_on:d}).select().single();if(error){toast('تعذر الحفظ');return}(u.mt=u.mt||[]).push({id:data.id,t,d});render();toast('تمت الإضافة للسجل')})}
function delM(id){const u=me();guard(async()=>{const r=await sb.from('maintenance_logs').delete().eq('id',id);if(r.error){toast('تعذر الحذف');return}u.mt=(u.mt||[]).filter(m=>m.id!==id);render()})}
function favF(){if(!me()){toast('سجل دخول عشان تشوف مفضلتك');return}S.fo=!S.fo;render()}
function fav(id,ev){ev.stopPropagation();const u=me();if(!u){S.ret=S.cur;S.retT='p';S.av='cl';tab('o');toast('سجل دخول عشان تضيف للمفضلة');return}const a=u.fav=u.fav||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);favSync(id,i<0);save();S.mode==='c'&&!S.cur?res():render()}
function doFPo(){const e=v('a1').toLowerCase(),own=S.av==='fo',acc=own?S.ws.find(x=>x.email===e):S.users.find(x=>x.e===e);if(!em(e)||!acc){toast('ما لقينا حساب بهذا الإيميل');return}S.fp={e,own,code:String(Math.floor(100000+Math.random()*900000))};go()}
function doFP(){const e=v('a1').toLowerCase();if(!em(e)){toast('اكتب إيميل صحيح');return}guard(async()=>{const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0].split('?')[0]});if(error){toast('تعذر الإرسال، جرب بعد دقيقة');return}S.av=S.av==='fo'?'ol':'cl';go();toast('إذا الإيميل مسجل وصلك رابط تغيير كلمة السر')})}
function doRC(){const pw=$('#a2').value;if(pw.length<8){toast('كلمة السر 8 خانات على الأقل');return}guard(async()=>{const{error}=await sb.auth.updateUser({password:pw});if(error){toast('تعذر تغيير كلمة السر، اطلب رابط جديد');return}S.av='';const{data}=await sb.auth.getSession(),ss=data.session;S.uid=ss?ss.user.id:null;await loadWs();if(!S.me&&ss){locU(await nmOf(ss.user),ss.user.email);await loadMine()}save();go();toast('تم تغيير كلمة السر')})}
function doFP2(){const f=S.fp,pw=$('#a2').value;if(v('b1')!==f.code){toast('رمز التحقق غلط');return}if(pw.length<8){toast('كلمة السر 8 خانات على الأقل');return}const acc=f.own?S.ws.find(x=>x.email===f.e):S.users.find(x=>x.e===f.e);acc.pw=pw;S.av=f.own?'ol':'cl';S.fp=null;save();go();toast('تم تغيير كلمة السر، سجل دخولك')}
function togB(b){const w=W(S.me);let a=w.br||[];if(b===BR[0])a=[b];else{a=a.filter(x=>x!==BR[0]);const i=a.indexOf(b);i<0?a.push(b):a.splice(i,1);if(!a.length)a=[BR[0]]}w.br=a;save();render()}
function setH(k,v){W(S.me)[k]=+v;save();toast('تم حفظ الدوام')}
render();applyLang();if(typeof MutationObserver!=='undefined')new MutationObserver(applyLang).observe($('#app'),{childList:true,subtree:true});autoLoc();
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.mode='o';S.av='rc';go()}});(async()=>{try{const{data}=await sb.auth.getSession(),ss=data.session;S.uid=ss?ss.user.id:null;if(ss&&ss.user)await mkPend(ss.user);S.adm=false;if(ss&&ss.user){const r=await sb.rpc('is_admin');S.adm=r.data===true}await loadWs();if(S.adm){S.user=null;await loadAdmin()}else if(ss&&ss.user){if(S.me)S.user=null;else if(S.av!=='rc'){locU(await nmOf(ss.user),ss.user.email);await loadMine()}}else{S.user=null;S.me=null}const qq=new URLSearchParams(location.search);if(qq.get('id')&&qq.get('status')&&S.me){const pid=qq.get('id');history.replaceState(null,'',location.pathname);S.mode='o';S.sp=true;await verifyPay(pid)}save();render()}catch(e){}})()}
</script>
